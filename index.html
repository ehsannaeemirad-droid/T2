<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>تاچ‌استون ۲</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f6f7fb">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- pull to refresh -->
<div class="ptr" id="ptr" aria-hidden="true">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
</div>

<div class="app">

  <header class="topbar glass">
    <div class="brand">
      <div class="brand-emoji" id="hdEmoji">👥</div>
      <div class="brand-text">
        <h1 class="brand-title" id="hdTitle">درس‌ها</h1>
        <p class="brand-sub" id="hdSub">درس را انتخاب کنید</p>
      </div>
    </div>
    <button class="icon-btn" id="gear" aria-label="تنظیمات">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <main id="content" class="content" aria-live="polite"></main>

  <nav class="tabbar glass" id="tabs" role="tablist" aria-label="بخش‌های برنامه">
    <span class="tab-pill" id="tabPill" aria-hidden="true"></span>

    <button class="tab is-active" data-tab="home" role="tab" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.8 20v-5.2h4.4V20"/>
      </svg>
      <span>خانه</span>
    </button>

    <button class="tab" data-tab="speaking" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.5 12.4c0 4-3.8 7.2-8.5 7.2-1 0-2-.15-2.9-.42L4 21l1.2-3.7A6.9 6.9 0 0 1 3.5 12.4c0-4 3.8-7.2 8.5-7.2s8.5 3.2 8.5 7.2Z"/>
      </svg>
      <span>گفت‌وگو</span>
    </button>

    <button class="tab" data-tab="grammar" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 6.5C10.6 5 8.6 4.4 6 4.4c-1 0-1.9.1-2.5.3v13.6c.6-.2 1.5-.3 2.5-.3 2.6 0 4.6.6 6 2.1"/>
        <path d="M12 6.5c1.4-1.5 3.4-2.1 6-2.1 1 0 1.9.1 2.5.3v13.6c-.6-.2-1.5-.3-2.5-.3-2.6 0-4.6.6-6 2.1"/>
        <path d="M12 6.5v13.6"/>
      </svg>
      <span>گرامر</span>
    </button>

    <button class="tab" data-tab="cards" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3.2" y="7.4" width="12.4" height="13" rx="2.6"/>
        <path d="M7.4 4.6h9.4a3 3 0 0 1 3 3v8.6"/>
      </svg>
      <span>فلش‌کارت</span>
    </button>

    <button class="tab" data-tab="practice" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13 2.5 4.8 13.2h5.6L10 21.5l8.3-10.7h-5.6L13 2.5Z"/>
      </svg>
      <span>تمرین</span>
    </button>
  </nav>

</div>

<div class="scrim" id="backdrop"></div>

<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="جزئیات">
  <div class="sheet-grip" id="sheetGrip"><span></span></div>
  <button class="sheet-close" id="sheetClose" aria-label="بستن">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
